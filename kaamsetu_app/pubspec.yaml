name: kaamsetu_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.1
  
  # Networking
  dio: ^5.4.3
  
  # Storage
  flutter_secure_storage: ^9.2.1
  shared_preferences: ^2.2.3
  
  # Localization
  intl: ^0.20.2
  
  # Data classes & JSON
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  geolocator: ^14.0.2
  image_picker: ^1.2.3
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Code Generation
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
